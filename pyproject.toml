[project]
name = "danchoicloud-github-app"
version = "0.1.0"
description = "A GitHub App with AI & Telegram Integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "PyGithub",
    "google-genai",
    "aiogram",
    "pydantic-settings",
    "python-dotenv",
    "telegramify-markdown>=0.5.2",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
]
